name: harvest-probe
on:
  push:
    paths:
      - '.github/workflows/harvest-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: harvest-probe
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'arena/34ebe542-royal-furniture-app'
      - name: Inspect product-detail payload shape
        run: |
          python3 - <<'PY'
          import json, urllib.request, pathlib

          BASE = 'https://rylqus.ae/api/products'
          HEADERS = {'Accept': 'application/json', 'locale': 'en', 'country': 'ae', 'User-Agent': 'Mozilla/5.0'}
          SLUGS = ['serafina-corner-sofa', 'kaspar-6-door-wardrobe', 'shadow-latex-pocket-spring-mattress']

          def fetch(url):
              request = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.loads(response.read().decode('utf-8', 'replace'))

          def summarize(value, depth=0):
              if isinstance(value, str):
                  if value.startswith('data:') or len(value) > 120:
                      return 'str(%d)' % len(value)
                  return value[:80]
              if isinstance(value, bool) or value is None or isinstance(value, (int, float)):
                  return value
              if isinstance(value, list):
                  return {'__list__': len(value), 'first': summarize(value[0], depth + 1) if value else None}
              if isinstance(value, dict):
                  if depth >= 3:
                      return {'__keys__': sorted(value.keys())[:12]}
                  return {k: summarize(v, depth + 1) for k, v in list(value.items())[:14]}
              return str(type(value))

          out = {}
          for slug in SLUGS:
              try:
                  detail = fetch(f'{BASE}/product-detail/{slug}/?format=json')
              except Exception as error:  # noqa: BLE001
                  out[slug] = {'error': str(error)}
                  continue
              if not isinstance(detail, dict):
                  out[slug] = {'error': 'not a dict'}
                  continue
              entry = {'top_level_keys': sorted(detail.keys())}
              # every key whose name hints at imagery, at any depth
              hits = {}
              def walk(node, path=''):
                  if isinstance(node, dict):
                      for key, value in node.items():
                          label = f'{path}.{key}' if path else key
                          if any(token in key.lower() for token in ('image', 'photo', 'gallery', 'media', 'video')):
                              hits[label] = summarize(value, 2)
                          walk(value, label)
                  elif isinstance(node, list):
                      for index, value in enumerate(node[:3]):
                          walk(value, f'{path}[{index}]')
              walk(detail)
              entry['image_fields'] = hits
              for key in ('primary_images', 'variant_images', 'images', 'colors', 'variants', 'info_section', 'general_information'):
                  if key in detail:
                      entry[key] = summarize(detail[key], 1)
              out[slug] = entry
              print('probed', slug, 'keys', len(detail.keys()), flush=True)

          pathlib.Path('harvest').mkdir(exist_ok=True)
          pathlib.Path('harvest/detail-shapes.json').write_text(json.dumps(out, indent=1))
          print('written', len(json.dumps(out)), 'bytes')
          PY
      - name: Commit
        run: |
          git config user.name 'harvest-bot'
          git config user.email 'harvest-bot@users.noreply.github.com'
          git add harvest/detail-shapes.json
          git commit -m 'chore(harvest): product-detail payload shapes [skip ci]' || echo 'nothing to commit'
          for attempt in 1 2 3; do
            git pull --rebase origin arena/34ebe542-royal-furniture-app && git push origin HEAD:arena/34ebe542-royal-furniture-app && break || sleep 5
          done
