name: Deploy web app to GitHub Pages

on:
  push:
    branches:
      - arena/7580beb8-royal-furniture-app
  workflow_dispatch:
    inputs:
      harvest_fabrics:
        description: Refresh official fabrics/colours and upload a downloadable artifact
        required: true
        default: false
        type: boolean
      harvest_delay:
        description: Minimum seconds between harvest requests
        required: true
        default: '0.25'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  harvest-fabrics:
    # Opt-in manual refresh; ordinary pushes never contact the catalogue API.
    if: ${{ inputs.harvest_fabrics || (github.event_name == 'push' && contains(github.event.head_commit.message, '[harvest-fabrics]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install image and HTTP tools
        run: python -m pip install requests==2.32.5 Pillow==12.0.0 numpy==2.3.4
      - name: Validate extractor
        run: python -m unittest scripts.fabrics.test_extract -v
      - name: Extract current official variants and assets
        run: python scripts/fabrics/extract.py --refresh --delay "${{ inputs.harvest_delay }}" --output fabric-output
      - name: Upload official fabric catalogue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-fabric-catalogue-${{ github.run_id }}
          path: fabric-output/
          if-no-files-found: warn
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the app
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build the Pages site
        run: npm run build:web:pages

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
