name: Deploy web app to GitHub Pages

on:
  push:
    branches:
      - arena/7580beb8-royal-furniture-app
  workflow_dispatch:
    inputs:
      harvest_fabrics:
        description: Refresh official fabrics/colours and upload a downloadable artifact
        required: true
        default: false
        type: boolean
      harvest_delay:
        description: Minimum seconds between harvest requests
        required: true
        default: '0.25'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  harvest-fabrics:
    # Opt-in manual refresh; ordinary pushes never contact the catalogue API.
    if: ${{ inputs.harvest_fabrics || (github.event_name == 'push' && contains(github.event.head_commit.message, '[harvest-fabrics]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/fabrics/requirements.txt
      - name: Install image and HTTP tools
        run: python -m pip install -r scripts/fabrics/requirements.txt
      - name: Validate extractor
        run: python -m unittest scripts.fabrics.test_extract -v
      - name: Extract current official variants and assets
        run: python scripts/fabrics/extract.py --refresh --delay "${{ inputs.harvest_delay || '0.25' }}" --output fabric-output
      - name: Upload official fabric catalogue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-fabric-catalogue-${{ github.run_id }}
          path: fabric-output/
          if-no-files-found: warn
          retention-days: 30

  fabric-qa:
    # Runs against the reviewed/installed manifest; does not repeat API harvests.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[fabric-qa]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # One-time bootstrap for the successful harvest whose blob download is
      # restricted in the sandbox. Future QA runs use the installed manifest.
      HARVEST_RUN_ID: '42385992930'
      # Optional one-time resume checkpoint; empty for normal installed-data QA.
      QA_CHECKPOINT_RUN_ID: ''
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/fabrics/requirements.txt
      - name: Install image and HTTP tools
        run: python -m pip install -r scripts/fabrics/requirements.txt
      - name: Validate render tools
        run: python -m unittest scripts.fabrics.test_extract scripts.fabrics.test_render -v
      - name: Stage reviewed official assets (or bootstrap downloaded harvest)
        run: |
          rm -rf fabric-output
          if [ -n "$QA_CHECKPOINT_RUN_ID" ]; then
            gh run download "$QA_CHECKPOINT_RUN_ID" -n "fabric-qa-checkpoint-$QA_CHECKPOINT_RUN_ID" --dir fabric-output
          elif python -c 'import json,sys; sys.exit(0 if not json.load(open("app/data/fabricManifest.json")).get("products") else 1)'; then
            gh run download "$HARVEST_RUN_ID" -n "official-fabric-catalogue-$HARVEST_RUN_ID" --dir fabric-output
          else
            mkdir -p fabric-output/assets
            cp app/data/fabricManifest.json fabric-output/fabric-manifest.json
            cp -r assets/fabrics fabric-output/assets/fabrics
            if [ -d assets/variants ]; then cp -r assets/variants fabric-output/assets/variants; fi
          fi
          # Normalize Current Fabric before validation; also updates the staged JSON.
          python scripts/fabrics/install.py fabric-output
      - name: Render approved masks and generate all contact sheets
        run: |
          # A checkpoint already contains originals and close-ups, so this is an
          # offline regeneration; a fresh harvest uses sequential image downloads.
          python scripts/fabrics/render.py --input fabric-output --delay 0.15
      - name: Upload rendered QA checkpoint
        if: ${{ success() && env.QA_CHECKPOINT_RUN_ID == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fabric-qa-checkpoint-${{ github.run_id }}
          path: fabric-output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Audit manifest and shipped/flagged assets
        run: python scripts/fabrics/validate.py --input fabric-output
      - name: Install reviewed QA output
        run: python scripts/fabrics/install.py fabric-output
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Verify real catalogue integration
        run: |
          npm run typecheck
          npx jest __tests__/fabrics.test.tsx --runInBand --silent
          npm run test:payments
      - name: Commit validated catalogue to this session branch
        run: |
          git config user.name "Arena Fabric QA"
          git config user.email "arena-fabric-qa@users.noreply.github.com"
          git add app/data/fabricManifest.json app/data/fabricAssets.ts assets/fabrics data/fabric-product-map.json docs/fabric-qa
          if [ -d assets/variants ]; then git add assets/variants; fi
          if git diff --cached --quiet; then echo "No generated changes"; exit 0; fi
          git diff --cached --stat
          git commit -m "Install current official fabric catalogue and QA"
          git push origin HEAD:arena/7580beb8-royal-furniture-app
      - name: Upload compact QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-qa-reports-${{ github.run_id }}
          path: |
            fabric-output/*report.json
            fabric-output/*report.md
            fabric-output/contact-sheet-index.html
          if-no-files-found: warn
          retention-days: 30

  build:
    if: ${{ !contains(github.event.head_commit.message, '[fabric-qa]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the app
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build the Pages site
        run: npm run build:web:pages

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
