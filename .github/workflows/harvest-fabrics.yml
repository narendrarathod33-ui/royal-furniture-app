name: Harvest official fabric catalogue

on:
  workflow_dispatch:
    inputs:
      delay:
        description: Minimum delay between requests in seconds (0.1 or more)
        required: true
        default: '0.25'
      refresh:
        description: Ignore cached API responses (fresh availability)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install image and HTTP tools
        run: python -m pip install requests==2.32.5 Pillow==12.0.0 numpy==2.3.4
      - name: Validate extractor
        run: python -m unittest scripts.fabrics.test_extract -v
      - name: Extract current official variants and assets
        env:
          REQUEST_DELAY: ${{ inputs.delay }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          args=(--delay "$REQUEST_DELAY" --output fabric-output)
          if [ "$REFRESH" = "true" ]; then args+=(--refresh); fi
          python scripts/fabrics/extract.py "${args[@]}"
      - name: Upload manifest, mapping, original assets and failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-fabric-catalogue
          path: |
            fabric-output/
            !fabric-output/**/*.png
          if-no-files-found: warn
          retention-days: 30
