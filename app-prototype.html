<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Furniture — glassmorphism prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101828; --red:#C0392B; --maroon:#7D0707; --muted:#7A6E74;
  --base:#FBF5EE; --w1:#F3D3C8; --w2:#F7E4C4; --w3:#E8D2D9; --w4:#FBE3D6;
  --gA:rgba(255,255,255,.72); --gB:rgba(255,255,255,.38); --gBorder:rgba(255,255,255,.75);
  --glassShadow:0 10px 28px rgba(125,7,7,.12),0 2px 6px rgba(16,24,40,.06);
  --hl:inset 0 1px 0 rgba(255,255,255,.9);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Montserrat,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--base);overflow:hidden}
#bg{position:fixed;inset:0;z-index:0;background-color:var(--base);pointer-events:none;
  background-image:
    radial-gradient(46vmax 46vmax at 85% 4%, var(--w1) 0%, transparent 62%),
    radial-gradient(52vmax 52vmax at 6% 32%, var(--w2) 0%, transparent 62%),
    radial-gradient(48vmax 48vmax at 92% 64%, var(--w3) 0%, transparent 62%),
    radial-gradient(54vmax 54vmax at 18% 98%, var(--w4) 0%, transparent 62%)}
.bub{position:absolute;border-radius:50%;opacity:.5;pointer-events:none;
  background:radial-gradient(circle at 30% 25%, #fff 0%, var(--bA) 22%, var(--bB) 68%, var(--bC) 100%)}
.bub.b1{width:170px;height:170px;top:-44px;inset-inline-end:-56px;animation:float 11s var(--ease) infinite alternate}
.bub.b2{width:130px;height:130px;bottom:-40px;inset-inline-start:-46px;animation:float 11s var(--ease) -5s infinite alternate}
@keyframes float{from{transform:translateY(0) scale(1)}to{transform:translateY(-18px) scale(1.04)}}

#app{position:relative;z-index:1;height:100%;display:none;flex-direction:column;max-width:520px;margin:0 auto}
@media(min-width:900px){#app{border-inline:1px solid rgba(255,255,255,.6)}}

.glass{background:linear-gradient(145deg,var(--gA),var(--gB));backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
  border:1px solid var(--gBorder);box-shadow:var(--glassShadow),var(--hl);border-radius:18px}
@supports not ((backdrop-filter:blur(4px)) or (-webkit-backdrop-filter:blur(4px))){.glass{background:rgba(255,255,255,.92)}}
@media (prefers-reduced-transparency: reduce){.glass{background:rgba(255,255,255,.96)}}

header#top{position:sticky;top:0;z-index:6;margin:10px 12px 0;border-radius:16px;padding:9px 12px;
  background:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.55));backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--gBorder);box-shadow:var(--glassShadow),var(--hl);display:flex;align-items:center;gap:10px}
header#top img{height:30px;display:block}
.hact{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.iconbtn{position:relative;width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  background:linear-gradient(145deg,var(--gA),var(--gB));border:1px solid var(--gBorder);box-shadow:var(--hl)}
.iconbtn:active{transform:scale(.96)}
#badge{position:absolute;top:-5px;inset-inline-end:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px}
#badge.bump{animation:bump .3s var(--ease)}
@keyframes bump{40%{transform:scale(1.45)}}
#badge.zero{display:none}#badge.on{display:inline-flex}

#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 12px 96px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}

/* screen-change motion: only when .enter is present (set on screen change, not redraws) */
.enter .anim{animation:rise .28s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- common bits ---------- */
.row{display:flex;gap:10px;align-items:center}
.h1{font-size:19px;font-weight:900;letter-spacing:-.2px;margin:14px 2px 10px}
.seeh{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px}
.seeh b{font-size:14px}.seea{font-size:11px;font-weight:800;color:var(--red);cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:14px;cursor:pointer;
  font:800 13px Montserrat,system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,#CE4436,#A32C20);
  box-shadow:0 10px 22px rgba(125,7,7,.25),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .12s var(--ease)}
.btn:active{transform:translateY(2px) scale(.99)}
.btn.ghost{background:linear-gradient(145deg,var(--gA),var(--gB));color:var(--ink);border:1px solid var(--gBorder);box-shadow:var(--glassShadow),var(--hl)}
.chip{flex:none;display:inline-flex;align-items:center;height:32px;padding:0 13px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
  color:var(--ink);background:rgba(255,255,255,.55);border:1px solid var(--gBorder);box-shadow:var(--hl)}
.chip.on{background:linear-gradient(180deg,#2A3448,#101828);color:#fff;border-color:#101828;box-shadow:0 6px 14px rgba(16,24,40,.28)}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 1px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.field{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--gBorder);background:rgba(255,255,255,.6);padding:0 12px;font:600 13px Montserrat,system-ui,sans-serif;color:var(--ink);outline:0}
.field::placeholder{color:var(--muted)}
.mut{color:var(--muted)}
.was{text-decoration:line-through;color:var(--muted);font-size:11px;font-weight:600;margin-inline-start:6px}
.pill{display:inline-flex;padding:3px 8px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:800}

/* ---------- home ---------- */
.promo{margin:12px 0 4px;padding:13px 14px;display:flex;align-items:center;gap:10px}
.promo b{font-size:13px}.promo .btn{min-height:36px;margin-inline-start:auto;padding:0 14px;font-size:12px}
.search{margin:10px 0 2px;display:flex;align-items:center;gap:8px;height:44px;border-radius:13px;padding:0 12px;background:rgba(255,255,255,.55);border:1px solid var(--gBorder);box-shadow:var(--hl)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:600 13px Montserrat,system-ui,sans-serif;color:var(--ink)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{cursor:pointer}
.tile .ph{aspect-ratio:1/1;border-radius:14px 14px 0 0;overflow:hidden;position:relative}
.tile .art{position:absolute;inset:0}
.tile .strip{margin:0 6px 6px;margin-top:-20px;position:relative;z-index:1;border-radius:10px;padding:7px 4px;text-align:center;font-size:10.5px;font-weight:800;
  background:linear-gradient(145deg,var(--gA),var(--gB));backdrop-filter:blur(14px) saturate(160%);border:1px solid var(--gBorder);box-shadow:var(--hl)}
@media(hover:hover){
  .tile{transition:transform .25s var(--ease);transform-style:preserve-3d}
  .tile:hover{transform:perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
  .tile .strip{position:relative;overflow:hidden}
  .tile .strip::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .2s;pointer-events:none;
    background:radial-gradient(70px 70px at var(--mx,50%) var(--my,50%), rgba(255,255,255,.95), transparent 70%)}
  .tile:hover .strip::after{opacity:.75}
}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 1px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:none;width:158px;padding:8px;cursor:pointer}
.mini .ph{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden}
.mini .nm{font-size:11.5px;font-weight:700;margin:7px 2px 0;line-height:1.3;min-height:30px}
.mini .pr{font-size:12.5px;font-weight:800;margin:3px 2px}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.trust .glass{padding:10px;font-size:10px;font-weight:700;line-height:1.4;text-align:center}
.trust .ico{font-size:16px}

/* ---------- cards (shop + rows) ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;padding:8px;cursor:pointer}
.card .ph{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden}
.card .nm{font-size:12px;font-weight:700;margin:8px 2px 0;line-height:1.35;min-height:32px}
.card .pr{font-size:13px;font-weight:800;margin:4px 2px}
.heart,.eye{position:absolute;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;
  background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 10px rgba(20,10,30,.15)}
.heart{top:8px;inset-inline-end:8px}.eye{top:8px;inset-inline-start:8px}
.heart.saved svg path{fill:var(--red);stroke:var(--red)}
.heart.pop{animation:pop .3s var(--ease)}
@keyframes pop{45%{transform:scale(1.35)}}
.art{width:100%;height:100%;display:block}

/* ---------- shop filter bar ---------- */
.fbar{position:sticky;top:0;z-index:5;margin:0 0 8px;padding:7px 8px;border-radius:14px;display:flex;gap:8px;align-items:center;
  background:linear-gradient(145deg,rgba(255,255,255,.6),rgba(255,255,255,.45));backdrop-filter:blur(14px) saturate(160%);border:1px solid var(--gBorder);box-shadow:var(--glassShadow),var(--hl)}
.fbar .search{flex:1;margin:0;height:36px;border-radius:10px;box-shadow:none;background:rgba(255,255,255,.55)}
.sortwrap{position:relative}
.subrow{overflow:hidden;max-height:0;opacity:0;transition:max-height .25s var(--ease),opacity .25s var(--ease)}
.subrow.open{max-height:60px;opacity:1;padding-bottom:8px}
.sortmenu{position:absolute;top:44px;inset-inline-end:0;z-index:9;min-width:190px;padding:6px;display:none}
.sortmenu.open{display:block}
.sortmenu .mi{padding:9px 10px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}
.sortmenu .mi:hover{background:rgba(255,255,255,.6)}
.sortmenu .mi.on{background:linear-gradient(180deg,#2A3448,#101828);color:#fff}

/* ---------- PDP ---------- */
.gal{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1/1;touch-action:pan-y;user-select:none}
.gtrack{display:flex;height:100%;transition:transform .0s}
.gtrack.anim{transition:transform .3s var(--ease)}
.gtrack.snap{transition:transform .25s var(--ease)}
.gtrack.fast{transition:transform .16s var(--ease)}
.gslide{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gslide .art{width:100%;height:100%;transition:transform .25s var(--ease);transform-origin:center center}
.dots{position:absolute;bottom:8px;inset-inline:0;display:flex;gap:5px;justify-content:center}
.dot{width:5px;height:5px;border-radius:3px;background:rgba(16,24,40,.25);transition:all .25s var(--ease)}
.dot.on{width:16px;background:var(--ink)}
.opt h4{margin:12px 2px 6px;font-size:12px}
.opt .chiprow .chip.off{opacity:.45;text-decoration:line-through}
.acc{margin-top:10px;overflow:hidden}
.acc summary{list-style:none;cursor:pointer;padding:13px 14px;font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc .in{padding:0 14px 13px;font-size:12px;line-height:1.55;color:#3E4756}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed rgba(16,24,40,.12);font-size:12px}

/* ---------- sheets / cart ---------- */
.sheet{position:fixed;z-index:30;inset-inline:0;bottom:0;transform:translateY(105%);transition:transform .3s var(--ease);max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px 16px 20px}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:rgba(16,24,40,.18);margin:0 auto 12px}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(16,24,40,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.line{display:flex;gap:10px;padding:10px;margin-bottom:10px;align-items:center}
.line .ph{width:74px;height:74px;border-radius:10px;overflow:hidden;flex:none;position:relative}
.qty{display:inline-flex;align-items:center;gap:10px}
.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--gBorder);background:rgba(255,255,255,.7);font-weight:900;cursor:pointer}
.qty button:disabled{opacity:.4}
.seg{display:inline-flex;padding:4px;gap:4px;border-radius:13px}
.seg .chip{box-shadow:none}
.total{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:6px 2px}
.total.big{font-size:15px;font-weight:900;border-top:1px solid rgba(16,24,40,.12);margin-top:6px;padding-top:12px}

/* ---------- nav ---------- */
nav#nav{position:fixed;z-index:20;inset-inline:12px;bottom:12px;max-width:496px;border-radius:26px;display:flex;justify-content:space-around;align-items:center;padding:8px 6px;
  background:linear-gradient(145deg,var(--gA),var(--gB));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--gBorder);box-shadow:var(--glassShadow),var(--hl)}
@supports not ((backdrop-filter:blur(4px)) or (-webkit-backdrop-filter:blur(4px))){nav#nav{background:rgba(255,255,255,.92)}}
.nav{display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;font-size:8.5px;font-weight:800;color:var(--muted);cursor:pointer;border-radius:14px;padding:5px 2px}
.nav.on{color:var(--maroon);background:rgba(125,7,7,.08)}
.nav.on .ic{animation:bounce .3s var(--ease)}
@keyframes bounce{45%{transform:translateY(-4px) scale(1.12)}}

/* ---------- toast ---------- */
#toast{position:fixed;z-index:40;inset-inline:0;bottom:86px;margin:0 auto;max-width:340px;padding:12px 16px;border-radius:14px;background:rgba(16,24,40,.92);color:#fff;
  font-size:12px;font-weight:700;text-align:center;opacity:0;transform:translateY(14px);transition:all .3s var(--ease);pointer-events:none}
#toast.on{opacity:1;transform:none}

/* ---------- launch ---------- */
#launch{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--base)}
#launch .glow{position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(70px);background:radial-gradient(circle,rgba(227,188,106,.8),rgba(142,27,44,.25) 60%,transparent 75%);transform:scale(.4);opacity:0}
#launch .card{position:relative;width:280px;padding:34px 26px 30px;border-radius:26px;text-align:center;overflow:hidden;transform:translateY(46px) scale(.86) perspective(700px) rotateX(14deg);opacity:0}
#launch .sweep{position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.85) 50%,transparent 58%);transform:translateX(-70%);opacity:0}
#launch.in .card{animation:rise1 1s var(--ease) .12s forwards}
#launch.in .glow{animation:bloom .9s var(--ease) .3s forwards}
#launch.in .sweep{animation:sweep .9s var(--ease) .55s forwards}
#launch.out{transition:opacity .5s var(--ease),transform .5s var(--ease);opacity:0;transform:scale(1.04)}
@keyframes rise1{60%{opacity:1}to{opacity:1;transform:none}}
@keyframes bloom{40%{opacity:1}to{opacity:.85;transform:scale(1.15)}}
@keyframes sweep{to{transform:translateX(70%);opacity:1}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
.rvnote{font-size:10px;color:var(--muted);margin:2px 2px 0}
</style>
</head>

/* ============ store (guarded persistence) ============ */
const KEY = "rf-proto-v2";
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return { lang: "en", cart: {}, saved: [], orders: [] };
    const o = JSON.parse(raw);
    if (typeof o !== "object" || o === null || Array.isArray(o)) throw 0;
    if (typeof o.cart !== "object" || o.cart === null || Array.isArray(o.cart)) o.cart = {};
    if (!Array.isArray(o.saved)) o.saved = [];
    if (!Array.isArray(o.orders)) o.orders = [];
    if (o.lang !== "en" && o.lang !== "ar") o.lang = "en";
    return o;
  } catch { return { lang: "en", cart: {}, saved: [], orders: [] }; } // broken data never blanks the app
}

}

  const t = L();
  $("#nav").innerHTML = [["home", t.home], ["shop", t.shop], ["stores", t.stores], ["cart", t.cart], ["more", t.more]].map(([k, n], i) =>
    `<span class="nav ${tab === k ? "on" : ""}" data-tab="${k}"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${NAVI[i][1]}"/></svg>${esc(n)}</span>`).join("");
}
function syncBadge(bump) {
  const n = Object.values(store.cart).reduce((a, b) => a + b, 0);
  const b = $("#badge");
  b.textContent = n;
  b.className = n ? "on" : "zero";
  if (n && bump && !reduced) { b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
}
let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 1900);
}

/* ============ interactions (delegated) ============ */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act],[data-tab]");
  if (!el) return closeMenus(e);
  if (el.dataset.tab) { show(el.dataset.tab); return; }
  const act = el.dataset.act, id = el.dataset.id;
  const p = DATA.find((d) => d.id === id);
  if (act === "save" && p) {
    e.stopPropagation();
    const was = store.saved.includes(id);
    store.saved = was ? store.saved.filter((x) => x !== id) : [id, ...store.saved];
    save();
    el.classList.toggle("saved", !was);
    if (!reduced) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
    toast(was ? L().unsave : L().save);
    if (tab === "cart") { paint(); view.classList.remove("enter"); return; } // redraw, no replay
    return;
  }
  if (act === "qv" && p) { e.stopPropagation(); openQuickView(p); return; }
  if (act === "open" && p) { openProduct(p.id); return; }
  if (act === "shop" || act === "shopcat") { if (act === "shopcat") { shop.cat = el.dataset.cat; shop.sub = "all"; } show("shop"); return; }
  if (act === "go-cart") { mode = "cart"; show("cart"); return; }
  if (act === "go-saved") { mode = "saved"; show("cart"); return; }
  if (act === "go-orders") { show("orders"); return; }
  if (act === "go-more") { show("more"); return; }
  if (act === "cat") { shop.cat = el.dataset.k; shop.sub = "all"; paint(); view.classList.add("enter"); view.classList.remove("enter"); return; }
  if (act === "sub") { shop.sub = el.dataset.k; paint(); return; }
  if (act === "sortmenu") { $("#sortmenu").classList.toggle("open"); return; }
  if (act === "sort") { shop.sort = el.dataset.k; paint(); return; }
  if (act === "lang") { store.lang = el.dataset.k; save(); applyLang(); return; }
  if (act === "mode") { mode = el.dataset.k; paint(); return; }
  if (act === "inc" || act === "dec") {
    const q = store.cart[id] || 0;
    const next = act === "inc" ? q + 1 : q - 1;
    if (next > 10) { toast(L().cap); return; }
    if (next <= 0) delete store.cart[id]; else store.cart[id] = next;
    save(); paint(); syncBadge(true); return;
  }
  if (act === "checkout") { openCheckout(); return; }
  if (act === "opt") {
    const p2 = DATA.find((d) => d.id === productId);
    const sel = SEL[p2.id];
    const g = el.dataset.g, k = el.dataset.k;
    if (g === "size") { const s = p2.sizes.find((x) => x.l === k); if (s.st === 0) { toast(L().oos); return; } sel.size = k; }
    if (g === "fab") sel.fab = k;
    if (g === "col") sel.col = k;
    paint(); view.classList.add("enter"); view.classList.remove("enter");
    return;
  }
  if (act === "addpdp") {
    const p2 = DATA.find((d) => d.id === productId);
    store.cart[p2.id] = Math.min(10, (store.cart[p2.id] || 0) + 1);
    save(); syncBadge(true); toast(L().added);
    return;
  }
  if (act === "notify") { closeSheet(); toast(L().willNotify); return; }
  if (act === "addqv") { store.cart[id] = Math.min(10, (store.cart[id] || 0) + 1); save(); closeSheet(); syncBadge(true); toast(L().added); return; }
  if (act === "gofull") { closeSheet(); openProduct(id); return; }
  if (act === "closesheet") { closeSheet(); return; }
  if (act === "place") { placeOrder(el); return; }
});
function closeMenus(e) { const m = $("#sortmenu"); if (m && m.classList.contains("open") && !e.target.closest(".sortwrap")) m.classList.remove("open"); }
document.addEventListener("input", (e) => {
  if (e.target.id === "shopq") { shop.q = e.target.value; const caret = e.target.selectionStart; paint(); const i = $("#shopq"); i.focus(); i.setSelectionRange(caret, caret); }
  if (e.target.id === "homeq" && e.key === "Enter") {}
});
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "homeq") { shop.q = e.target.value; show("shop"); } });

/* ============ quick view / checkout sheets ============ */
function openQuickView(p) {
  const t = L();
  const optCount = (p.sizes?.length || 0) + (p.fabrics?.length || 0) + (p.colors?.length || 0);
  const stock = stockOf(p, SEL[p.id] || {});
  const disc = p.w > p.p ? Math.round((1 - p.p / p.w) * 100) : 0;
  $("#sheet").innerHTML = `<div class="grab"></div>
    <div class="row" style="gap:12px;align-items:flex-start"><div class="ph" style="width:120px;height:120px;border-radius:14px;overflow:hidden;flex:none">${art(p.seed)}</div>
      <div style="flex:1;min-width:0"><b style="font-size:14px">${esc(p.n)}</b>
        <div style="font-size:16px;font-weight:900;margin:6px 0 2px">${money(p.p)}${p.w > p.p ? `<span class="was">${money(p.w)}</span>` : ""} ${disc ? `<span class="pill">${disc}%</span>` : ""}</div>
        <div class="rvnote">🚚 ${esc(p.dl)}</div></div></div>
    <p style="font-size:12px;line-height:1.55;color:#3E4756">${esc(p.d)}</p>
    ${stock === 0 ? `<button class="btn ghost" style="width:100%" data-act="notify">🔔 ${t.notify}</button>`
      : optCount > 1 ? `<button class="btn" style="width:100%" data-act="gofull" data-id="${p.id}">${t.viewFull}</button>`
      : `<button class="btn" style="width:100%" data-act="addqv" data-id="${p.id}">${t.addCart}</button>`}
    <button class="btn ghost" style="width:100%;margin-top:8px" data-act="closesheet">${store.lang === "ar" ? "إغلاق" : "Close"}</button>`;
  $("#scrim").classList.add("on");
  $("#sheet").classList.add("open");
}
function openCheckout() {
  const t = L();
  $("#sheet").innerHTML = `<div class="grab"></div><b style="font-size:14px">${t.checkout}</b>
    <div style="margin-top:12px"><input class="field" id="ckname" placeholder="${esc(t.name)}" style="margin-bottom:8px"><input class="field" id="ckphone" inputmode="numeric" placeholder="${esc(t.phone)}"></div>
    <div class="rvnote" id="ckerr" style="color:var(--red);min-height:16px;margin:6px 0"></div>
    <button class="btn" style="width:100%" data-act="place">${t.place}</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" data-act="closesheet">${store.lang === "ar" ? "إغلاق" : "Close"}</button>`;
  $("#scrim").classList.add("on");
  $("#sheet").classList.add("open");
}
function placeOrder() {
  const t = L();
  const name = $("#ckname").value.trim();
  const digits = $("#ckphone").value.replace(/\D/g, "");
  if (!name) { $("#ckerr").textContent = t.nameErr; return; }
  if (digits.length < 7 || digits.length > 20) { $("#ckerr").textContent = t.phoneErr; return; }
  const lines = Object.keys(store.cart).map((id) => { const p = DATA.find((d) => d.id === id); return { n: p.n, q: store.cart[id], p: p.p }; });
  const total = lines.reduce((a, l) => a + l.p * l.q, 0);
  const order = { id: "RF-" + String(Math.floor(1e7 + Math.random() * 9e7)), date: new Date().toISOString().slice(0, 10), lines, total };
  store.orders.unshift(order);
  store.cart = {};
  save(); closeSheet(); syncBadge(false);
  view.classList.remove("enter");
  tab = "orders";
  view.innerHTML = `<div class="anim glass" style="padding:30px;text-align:center"><div style="font-size:34px">✅</div><div class="h1">${t.thanks}</div><div class="rvnote">${esc(order.id)} · ${money(order.total)}</div><div class="rvnote">${t.thanksSub}</div><button class="btn" style="margin-top:14px" data-act="go-orders">${t.myOrders}</button></div>`;
  view.classList.add("enter");
}
function closeSheet() { $("#sheet").classList.remove("open"); $("#scrim").classList.remove("on"); }
$("#scrim").addEventListener("click", closeSheet);

/* ============ gallery (drag, commit >50px, zoom, dots, RTL) ============ */
function bindGallery() {
  const gal = $("#gal"); if (!gal) return;
  const track = $("#gtrack");
  const n = $$(".gslide", track).length;
  const w = gal.clientWidth;
  const dir = rtl() ? -1 : 1;
  const setX = (px, cls) => { track.className = "gtrack " + cls; track.style.transform = `translateX(${dir * -galIndex * w + px}px)`; };
  setX(0, "anim");
  let x0 = null, dx = 0, zoomed = false;
  gal.addEventListener("pointerdown", (e) => { x0 = e.clientX; dx = 0; if (!zoomed) setX(0, ""); });
  gal.addEventListener("pointermove", (e) => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    if (!zoomed) setX(dx, "");
  });
  const end = () => {
    if (x0 === null) return;
    x0 = null;
    if (zoomed) return;
    if (dx > 50 && galIndex > 0) { galIndex--; }
    else if (dx < -50 && galIndex < n - 1) { galIndex++; }
    setX(0, dx !== 0 ? "fast" : "anim");
    $$(".dot", gal).forEach((d, i) => d.classList.toggle("on", i === galIndex));
    setTimeout(() => { track.className = "gtrack anim"; }, 170);
  };
  gal.addEventListener("pointerup", end);
  gal.addEventListener("pointerleave", end);
  gal.addEventListener("dblclick", () => { zoomed = !zoomed; $$(".art", gal).forEach((a, i) => a.style.transform = zoomed && i === galIndex ? "scale(2)" : ""); });
  gal.addEventListener("wheel", (e) => { if (!e.ctrlKey) return; e.preventDefault(); zoomed = e.deltaY < 0; $$(".art", gal).forEach((a, i) => a.style.transform = zoomed && i === galIndex ? "scale(2)" : ""); }, { passive: false });
}

/* ============ language ============ */
function applyLang() {
  document.documentElement.lang = store.lang;
  document.documentElement.dir = rtl() ? "rtl" : "ltr";
  buildNav(); show(tab);
}

/* ============ bind per-screen extras ============ */
function bindScreen() { buildNav(); bindGallery(); }

/* ============ launch ============ */
function boot() {
  $("#app").style.display = "flex";
  buildNav();
  show("home");
  const img = new Image();
  img.src = $("#logo").src;
  const start = () => {
    const l = $("#launch");
    if (reduced) { l.style.transition = "opacity .7s"; l.style.opacity = "0"; setTimeout(() => l.remove(), 720); return; }
    requestAnimationFrame(() => l.classList.add("in"));
    const out = () => { l.classList.add("out"); setTimeout(() => l.remove(), 520); window.removeEventListener("keydown", skip); };
    const skip = () => out();
    setTimeout(out, 2000);
    window.addEventListener("keydown", skip, { once: true });
    l.addEventListener("click", skip, { once: true });
  };
  (img.decode ? img.decode().then(start, start) : (img.onload = start));
}
boot();
</script>
